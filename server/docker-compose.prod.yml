services:
  reverse_proxy:
    image: nginx:alpine
    container_name: privprint-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privprint-db-migrate-prod
    command: alembic upgrade head
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEVELOPMENT_OTP_ENABLED: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://privprint_prod_user:${POSTGRES_PASSWORD}@db:5432/privprint_prod_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must be set}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must be set}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:?TWILIO_VERIFY_SERVICE_SID must be set}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privprint-api-prod
    expose:
      - "8080"
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEVELOPMENT_OTP_ENABLED: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://privprint_prod_user:${POSTGRES_PASSWORD}@db:5432/privprint_prod_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must be set}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must be set}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:?TWILIO_VERIFY_SERVICE_SID must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  cleanup_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privprint-cleanup-worker-prod
    command: python -m app.services.document_cleanup
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEVELOPMENT_OTP_ENABLED: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://privprint_prod_user:${POSTGRES_PASSWORD}@db:5432/privprint_prod_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must be set}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must be set}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:?TWILIO_VERIFY_SERVICE_SID must be set}
    depends_on:
      api:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: privprint-db-prod
    environment:
      POSTGRES_USER: privprint_prod_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: privprint_prod_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privprint_prod_user -d privprint_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: privprint-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
  redisdata_prod:
