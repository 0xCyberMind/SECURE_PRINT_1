version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privprint-api-dev
    ports:
      - "8080:8080"
    env_file:
      - .env.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privprint-worker-dev
    command: python -m app.services.document_cleanup
    env_file:
      - .env.development
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: privprint-db-dev
    environment:
      POSTGRES_USER: privprint_dev
      POSTGRES_PASSWORD: privprint_dev_pass
      POSTGRES_DB: privprint_dev_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privprint_dev -d privprint_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: privprint-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: privprint-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dev_minio_access
      MINIO_ROOT_PASSWORD: dev_minio_secret_key_32bytes
    command: server /data --console-address ":9001"
