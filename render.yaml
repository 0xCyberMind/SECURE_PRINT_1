services:
  - type: web
    name: secure-print-1
    env: python
    region: oregon
    plan: starter
    buildCommand: "cd server && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd server && uvicorn app.main:create_application --factory --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: privprint-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 10000

databases:
  - name: privprint-db
    databaseName: privprint
    user: privprint
    plan: free
